[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robin-fpga"
version = "1.0.0"
description = "Robust FPGA timing closure via distributionally-robust RL and conformal sign-off"
authors = [{name = "Saher Elsayed", email = "selsayed@seas.upenn.edu"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.1",
  "torch-geometric>=2.4",
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "seaborn>=0.13",
  "tqdm>=4.65",
  "pyyaml>=6.0",
  "click>=8.1",
  "rich>=13.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "black>=24.0",
  "ruff>=0.4",
  "mypy>=1.8",
  "pre-commit>=3.6",
]
docs = [
  "sphinx>=7.2",
  "sphinx-rtd-theme>=2.0",
  "myst-parser>=2.0",
]
notebooks = [
  "jupyterlab>=4.0",
  "ipywidgets>=8.1",
]

[project.urls]
Homepage      = "https://github.com/Saher-Elsayed/ROBIN"
Documentation = "https://saher-elsayed.github.io/ROBIN/"
Repository    = "https://github.com/Saher-Elsayed/ROBIN.git"
Paper         = "https://github.com/Saher-Elsayed/ROBIN/blob/main/paper/robin.pdf"

[project.scripts]
robin-train      = "robin.trainer:main"
robin-evaluate   = "robin.evaluator:main"
robin-load-runs  = "robin.data_loader:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E","F","W","I","N","UP","B","C4","SIM"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q --strict-markers"
